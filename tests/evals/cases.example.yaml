# ClawBot 路由评测用例（示例）
# 运行：python tests/evals/run_eval.py --cases tests/evals/cases.example.yaml
# 或：pytest tests/test_eval_runner.py

version: 1

cases:
  # 简单：活跃待办 +「做完了」→ 确定性快通道 todo.done_current（不调用 LLM）
  - id: fast_done_current
    tier: simple
    input: "做完了"
    from_user: "eval-user-1"
    pre_setup:
      active_todo_queue: true
      tasks: ["写评测骨架", "补 structured state"]
      idx: 0
    expect_tool: "todo.done_current"
    expect_state_contains: ["待办推进: todo.done_current"]
    expect_reply_contains:
      - "下一个"
      - "写评测骨架"
      - "补 structured state"
    expect_decisions_len: 1
    expect_wx_max_len: 2
    expect_tool_counts:
      todo.done_current: 1

  # 简单：查看待办（自然语言）→ LangGraph + stub LLM（离线评测无 vault 正文时可视为闲聊 none）
  # 想看本地📋节请用 /待办 slash 命令（只在 handle() 里生效，evaluator 不覆盖）
  - id: local_view_todo
    tier: simple
    input: "查看待办"
    expect_tool: "none"

  - id: p1b_done_when_queue_tail
    tier: simple
    input: "搞定了"
    from_user: "eval-user-p1b-tail"
    pre_setup:
      active_todo_queue: true
      tasks: ["最后一项"]
      idx: 0
    expect_tool: "todo.done_current"
    expect_reply_contains:
      - "最后一项"
      - "全部完成"
    expect_decisions_len: 1
    expect_wx_max_len: 2
    expect_tool_counts:
      todo.done_current: 1

  # 中等：无规则命中；stub LLM 仍返回结构化 none（不复现旧版 safe_fallback 文案）
  - id: safe_fallback_gibberish
    tier: medium
    input: "xyzabc 无意义一串"
    expect_tool: "none"

# 微信 ClawBot → OpenCode ACP → Vault 配置
# ==========================================

# ─── OpenCode ACP ───
opencode:
  acp_command: "opencode"
  cwd: "D:/Lenovo/Documents/世界树/世界树"
  port: 0    # 0 = 自动选择端口，避免冲突
  hostname: "127.0.0.1"
  max_tokens: 4096
  model: "deepseek/deepseek-v4-flash"        # 默认文本模型
  multimodal_model: "alibaba-cn/qwen3-vl-plus"   # 多模态（图片）模型
  mcp_servers: []  # 可选：透传到 session/new 的 MCP servers（结构同 OpenCode）

  # 意图小模型（历史字段）：Handler 主链路已不再读取；可删可留，不影响运行。
  # 聊天路由：detect_intent / 快通道 → unified 决策。
  # intent_model: "alibaba-cn/qwen3.5-flash"
  # intent_threshold_high: 0.8
  # intent_threshold_mid: 0.5

# ─── Vault 路径 ───
vault:
  root: "D:/Lenovo/Documents/世界树/世界树"
  daily_log_dir: "2-Areas/习惯养成/生活日志"
  diary_dir: "2-Areas/习惯养成/日记"
  project_dir: "1-Projects/生生"
  task_dir: "任务系统"

timeline:
  enabled: true
  root_dir: "D:/Lenovo/Documents/世界树/世界树"
  timeline_dir: "2-Areas/习惯养成/时间轴"
  state_dir: "@bot"
  slot_minutes: 30
  append_separator: "|"
  checkin_enabled: true
  project_overview_path: "1-Projects/项目进度总览.md"
  checkin_ai_timeout_sec: 12
  checkin_poll_interval_sec: 0
  write_policy: "whitelist_only"
  checkin_write_if_filled: false
  compact_enabled: true
  compact_max_chars: 80

# ─── 生生项目分类 ───
categories:
  - 身体    # 体重 + 睡眠（数值追踪）
  - 运动    # 跑步/健身/散步（行为追踪）
  - 阅读    # 看的书 + 时长（知识追踪）
  - 事务    # 洗衣服/买菜/做饭 等日常生活（兜底）

# ─── Bot 行为 ───
bot:
  reply_on_record: true          # 记录后回复确认
  reply_on_error: true           # 出错时告知用户
  typing_indicator: true         # 处理中显示"正在输入"
  max_reply_length: 2000         # 回复最大长度（微信限制）
  wx_agent_allowlist: ["*"]  # 或具体 wxid
  agent_model: ""  # 为空则沿用 opencode.model
  reminder_polish_enabled: true
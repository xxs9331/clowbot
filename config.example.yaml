# 微信 ClawBot → OpenCode ACP → Vault 配置
# ==========================================

# ─── OpenCode ACP ───
opencode:
  acp_command: "opencode"
  cwd: "D:/Lenovo/Documents/世界树/世界树"
  port: 4096
  hostname: "127.0.0.1"
  # 单次回复 maxTokens（OpenCode session/prompt）；需要更长输出时可调大
  max_tokens: 4096
  model: "opencode-go/deepseek-v4-flash"        # 默认文本模型
  multimodal_model: "opencode-go/qwen3.6-plus"  # 多模态（图片）模型

  # 意图小模型（可选；缺省 = 主 model）
  # intent_model: "alibaba-cn/qwen3.5-flash"
  # intent_threshold_high: 0.8
  # intent_threshold_mid: 0.5
  structured_retry_count: 3

  # 流式 agent_message_chunk 与最终 JSON-RPC 文本合并，避免半句回复（建议 true）
  reply_merge_enabled: true
  # false：禁止 record_add 走意图高分短路，一律交给 unified（续写/代词更稳）
  # true：允许短路，但对极短句/代词句仍会阻止短路
  record_high_conf_short_circuit: false
  # 路由短期记忆超过阈值时写入 .clawbot_tmp/context_spills/*.json，仅回注句柄
  # 首条记忆用较大阈值；同会话后续条用 followup，减轻多轮回环时上下文膨胀
  memory_spill_chars: 2000
  memory_spill_chars_followup: 1200

# ─── Vault 路径 ───
vault:
  root: "D:/Lenovo/Documents/世界树/世界树"
  daily_log_dir: "2-Areas/习惯养成/生活日志"
  project_dir: "1-Projects/生生"
  task_dir: "任务系统"

# ─── 生生项目分类 ───
categories:
  - 身体    # 体重 + 睡眠（数值追踪）
  - 运动    # 跑步/健身/散步（行为追踪）
  - 阅读    # 看的书 + 时长（知识追踪）
  - 事务    # 洗衣服/买菜/做饭 等日常生活（兜底）

# ─── Bot 行为 ───
bot:
  reply_on_record: true          # 记录后回复确认
  reply_on_error: true           # 出错时告知用户
  typing_indicator: true         # 处理中显示"正在输入"
  max_reply_length: 2000         # 回复最大长度（微信限制）
  # 工具中间态提示（executing/result_ready/done），默认关闭避免刷屏
  tool_progress_messages: false
  tool_progress_min_interval_sec: 0.8
  # 工具执行超过该秒数仍未返回时发一条慢提示（与 tool_progress_messages 独立；0 关闭）
  tool_slow_hint_seconds: 3
  tool_slow_hint_text: "还在处理中，稍等我一下…"

# ─── Agent 可靠性 ───
agent:
  # 跨消息连续自动执行步数上限；超过则强制中断，需人工介入
  max_steps: 15
  # 每 N 步触发一次轻量 checkpoint（当前进度/缺什么/下一步）
  checkpoint_every: 5
  # structured state 超时分钟数；超过后全量清空重建
  state_ttl_minutes: 30
  # 调试模型（可选；为空则复用主模型）
  # debug_model: "opencode-go/deepseek-v4-mini"
  debug_model: ""
  # 启用调试模型（默认 false，仅开发调试时打开）
  debug_enabled: false
